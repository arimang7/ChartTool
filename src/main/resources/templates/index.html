<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>AI 주식 분석 도구 (Java)</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #1e1e1e;
            color: white;
            font-family: sans-serif;
        }

        .sidebar {
            width: 260px;
            position: fixed;
            height: 100%;
            background: #111;
            padding: 20px;
            border-right: 1px solid #333;
        }

        .main {
            margin-left: 300px;
            padding: 20px;
        }

        .search-box {
            display: flex;
            margin-bottom: 20px;
        }

        .search-box input {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 4px 0 0 4px;
            flex-grow: 1;
        }

        .search-box button {
            background: #ff4b4b;
            border: none;
            padding: 10px 15px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            color: white;
        }

        .metric-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .content-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .metric-box {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
            border-left: 4px solid #ff4b4b;
        }

        .metric-label {
            font-size: 0.8em;
            color: #aaa;
        }

        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 5px;
        }

        .ai-report {
            background: #262730;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            line-height: 1.6;
        }

        .ai-report h1,
        .ai-report h2,
        .ai-report h3 {
            color: #ff4b4b;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .ai-report p {
            margin-bottom: 10px;
        }

        .ai-report ul,
        .ai-report ol {
            margin-bottom: 10px;
            padding-left: 25px;
        }

        .ai-report li {
            margin-bottom: 5px;
        }

        .status-container {
            background: #262730;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            margin-bottom: 20px;
            display: none;
        }

        .status-step {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #888;
            font-size: 0.95em;
        }

        .status-step.active {
            color: #fff;
            font-weight: bold;
        }

        .status-step i.fa-check {
            color: #28a745;
        }

        .status-step i.fa-circle-notch {
            color: #ff4b4b;
        }

        .btn-ai {
            background: #ff4b4b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-ai:hover {
            background: #ff3333;
        }

        hr {
            border: 0;
            border-top: 1px solid #333;
            margin: 20px 0;
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            color: #444;
            padding: 8px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-google img {
            width: 20px;
            margin-right: 10px;
        }

        .timer-badge {
            background: #333;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            color: #ff4b4b;
            border: 1px solid #444;
            display: none;
            margin-bottom: 10px;
            font-family: monospace;
        }

        .btn-telegram {
            background: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-telegram:hover {
            background: #0077b5;
        }

        .btn-telegram i {
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2>계정</h2>
        <div th:if="${userEmail != 'Guest User'}">
            <p th:text="'👤 ' + ${userEmail}"></p>
            <a href="/logout" style="color: #aaa; font-size: 0.9em;">로그아웃</a>
        </div>
        <div th:if="${userEmail == 'Guest User'}">
            <p>👤 Guest User</p>
            <a href="/oauth2/authorization/google" class="btn-google">
                <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="G"> Google 로그인
            </a>
        </div>
        <hr>
        <h3>📈 종목 검색</h3>
        <form action="/" method="get" id="search-form">
            <div class="market-selector" style="margin-bottom: 10px; display: flex; gap: 15px; font-size: 0.9em;">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="radio" name="market" value="US" th:checked="${market == 'US' or market == null}"> 🇺🇸 미국
                </label>
                <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="radio" name="market" value="KR" th:checked="${market == 'KR'}"> 🇰🇷 한국
                </label>
                <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="radio" name="market" value="HK" th:checked="${market == 'HK'}"> 🇭🇰 홍콩
                </label>
            </div>
            <div class="search-box" style="display: flex; position: relative;">
                <input type="text" id="ticker-input" name="ticker" th:value="${ticker}" placeholder="티커 또는 종목명 입력" autocomplete="off">
                <button type="submit"><i class="fas fa-search"></i></button>
                <div id="autocomplete-results" style="position: absolute; top: 100%; left: 0; right: 0; background: #2d2d2d; border: 1px solid #444; border-top: none; z-index: 1000; display: none; max-height: 300px; overflow-y: auto;"></div>
            </div>
        </form>
        <hr>
        <div th:if="${!data.isEmpty() and data.news != null and !data.news.isEmpty()}">
            <h3>📰 최신 증권 소식</h3>
            <ul style="list-style: none; padding: 0; font-size: 0.85em; color: #ddd;">
                <li th:each="info : ${data.news}" style="margin-bottom: 12px; line-height: 1.4;">
                    <a th:href="${info.link}" target="_blank"
                        style="color: #4da3ff; text-decoration: none; display: block; font-weight: bold; margin-bottom: 3px;"
                        th:text="${info.title}"></a>
                    <span th:text="'출처: ' + ${info.publisher}" style="color: #888; font-size: 0.9em;"></span>
                </li>
            </ul>
            <hr>
        </div>
    </div>
    <div class="main">
        <h1
            th:text="${data.containsKey('name')} ? ${data.name} + ' (' + ${ticker} + ') 실시간 차트 및 AI 분석' : (${ticker != ''} ? ${ticker} + ' 실시간 차트 및 AI 분석' : 'AI 주식 분석 도구')">
        </h1>

        <div th:if="${ticker == ''}" style="text-align: center; margin-top: 100px; color: #888;">
            <i class="fas fa-chart-line" style="font-size: 5em; margin-bottom: 20px; color: #333; display: block;"></i>
            <h2 style="color: #666;">실시간 시장 데이터를 확인해 보세요.</h2>
            <p>왼쪽 검색창에 궁금한 종목의 티커(예: TSLA, IONQ)를 입력하면<br>실시간 차트와 AI 심층 분석 리포트를 생성합니다.</p>
        </div>

        <div th:if="${error}"
            style="background: #ff4444; color: white; padding: 10px; border-radius: 4px; margin-bottom: 20px;">
            <strong>⚠️ 오류:</strong> <span th:text="${error}"></span>
        </div>

        <div th:if="${!data.isEmpty()}">
            <div class="content-row">
                <div id="chart" style="flex: 3; height: 600px;"></div>

                <div style="flex: 1;">
                    <h3>주요 지표</h3>
                    <div class="metric-box" style="margin-bottom: 15px;">
                        <div class="metric-label">현재가</div>
                        <div class="metric-value"
                            th:text="${currencySymbol} + (${currencySymbol == '₩'} ? ${#numbers.formatDecimal(data.price, 0, 'COMMA', 0, 'POINT')} : ${#numbers.formatDecimal(data.price, 0, 'COMMA', 2, 'POINT')})">
                        </div>
                    </div>
                    <div class="metric-box" style="margin-bottom: 15px;">
                        <div class="metric-label">RSI(14)</div>
                        <div class="metric-value" th:text="${#numbers.formatDecimal(data.rsi, 1, 2)}"></div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">패턴</div>
                        <div class="metric-value" th:text="${data.pattern}"></div>
                    </div>
                </div>
            </div>

            <hr>
            <h3>🪄 AI 심층 분석 리포트</h3>

            <!-- 타이머 및 분석 단계 표시 컨테이너 -->
            <div id="ai-timer" class="timer-badge">
                <i class="fas fa-stopwatch"></i> 분석 진행 시간: <span id="timer-sec">0.0</span>s
            </div>

            <div id="ai-status" class="status-container">
                <div class="status-step" id="step-1">
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <span><i class="far fa-circle"></i> 📊 기술적 지표 및 증권사 리포트 분석</span>
                        <span class="step-time" style="font-size: 0.8em; color: #666;"></span>
                    </div>
                </div>
                <div class="status-step" id="step-2">
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <span><i class="far fa-circle"></i> 📐 하모닉 패턴(Gartley, Cypher, AB=CD) 탐색</span>
                        <span class="step-time" style="font-size: 0.8em; color: #666;"></span>
                    </div>
                </div>
                <div class="status-step" id="step-3">
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <span><i class="far fa-circle"></i> 🤖 Gemini LLM 전략 생성</span>
                        <span class="step-time" style="font-size: 0.8em; color: #666;"></span>
                    </div>
                </div>
            </div>

            <div id="ai-btn-container">
                <button type="button" class="btn-ai" th:data-ticker="${ticker}"
                    onclick="runAiAnalysis(this.getAttribute('data-ticker'))">분석 실행하기</button>
            </div>

            <div id="ai-report-container" class="ai-report" style="display: none;">
                <div id="ai-score-header" style="margin-bottom: 15px; color: #ff4b4b; font-weight: bold;"></div>
                <div id="ai-content"></div>
                <button type="button" class="btn-telegram" id="btn-send-telegram" onclick="sendAiReport()">
                    <i class="fab fa-telegram-plane"></i> 텔레그램으로 전송하기
                </button>
            </div>
        </div>

    </div>
    <script>
        // Autocomplete logic
        const tickerInput = document.getElementById('ticker-input');
        const autocompleteResults = document.getElementById('autocomplete-results');
        const searchForm = document.getElementById('search-form');
        let debounceTimer;

        tickerInput.addEventListener('input', function () {
            clearTimeout(debounceTimer);
            const query = this.value.trim();
            const market = document.querySelector('input[name="market"]:checked').value;

            if (query.length < 1) {
                autocompleteResults.style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(() => {
                fetch(`/api/search?q=${encodeURIComponent(query)}&market=${market}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.length > 0) {
                            autocompleteResults.innerHTML = data.map(item => `
                                <div class="autocomplete-item" style="padding: 10px; cursor: pointer; border-bottom: 1px solid #444;" 
                                     data-symbol="${item.symbol}" data-name="${item.name}">
                                    <span style="font-weight: bold; color: #ff4b4b;">${item.symbol}</span> - 
                                    <span style="color: #ddd;">${item.name}</span>
                                </div>
                            `).join('');
                            autocompleteResults.style.display = 'block';

                            // Add click events to items
                            document.querySelectorAll('.autocomplete-item').forEach(item => {
                                item.addEventListener('mouseenter', function() {
                                    this.style.background = '#444';
                                });
                                item.addEventListener('mouseleave', function() {
                                    this.style.background = 'transparent';
                                });
                                item.addEventListener('click', function () {
                                    tickerInput.value = this.dataset.symbol;
                                    autocompleteResults.style.display = 'none';
                                    searchForm.submit();
                                });
                            });
                        } else {
                            autocompleteResults.style.display = 'none';
                        }
                    });
            }, 300);
        });

        // Close autocomplete on click outside
        document.addEventListener('click', function (e) {
            if (!tickerInput.contains(e.target) && !autocompleteResults.contains(e.target)) {
                autocompleteResults.style.display = 'none';
            }
        });
    </script>
    <script th:inline="javascript" th:if="${!data.isEmpty()}">
        var currentTicker = /*[[${ticker}]]*/ "";
        var latestReport = "";
        var stockHistory = /*[[${data.history}]]*/[];
        var spikes = /*[[${data.spikes}]]*/[];

        // 천단위 콤마 헬퍼 함수
        function formatNumber(num, decimals) {
            return num.toLocaleString('ko-KR', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        }

        var priceTrace = {
            x: stockHistory.map(h => new Date(h.date)),
            open: stockHistory.map(h => h.open), high: stockHistory.map(h => h.high),
            low: stockHistory.map(h => h.low), close: stockHistory.map(h => h.close),
            type: 'candlestick', name: 'Price'
        };

        var upperTrace = {
            x: priceTrace.x, y: stockHistory.map(h => h.upper),
            line: { color: 'rgba(173, 216, 230, 0.3)', width: 1 },
            name: 'Upper Band', type: 'scatter', mode: 'lines'
        };

        var lowerTrace = {
            x: priceTrace.x, y: stockHistory.map(h => h.lower),
            line: { color: 'rgba(173, 216, 230, 0.3)', width: 1 },
            name: 'Lower Band', type: 'scatter', mode: 'lines', fill: 'tonexty'
        };

        var shapes = spikes.map(index => ({
            type: 'rect', xref: 'x', yref: 'paper',
            x0: priceTrace.x[index], x1: priceTrace.x[index],
            y0: 0, y1: 1, fillcolor: 'orange', opacity: 0.1, line: { width: 0 }
        }));

        var layout = {
            template: 'plotly_dark',
            shapes: shapes,
            xaxis: { rangeslider: { visible: false } },
            margin: { t: 30, l: 50, r: 30, b: 50 }
        };
        Plotly.newPlot('chart', [priceTrace, upperTrace, lowerTrace], layout);
        setTimeout(() => { Plotly.Plots.resize('chart'); }, 500);

        // AI 분석 실행 및 단계 표시 로직
        let analysisStartTime;
        let timerInterval;

        function runAiAnalysis(ticker) {
            const statusDiv = document.getElementById('ai-status');
            const btnContainer = document.getElementById('ai-btn-container');
            const timerDiv = document.getElementById('ai-timer');
            const timerSec = document.getElementById('timer-sec');

            // 초기화
            btnContainer.style.display = 'none';
            statusDiv.style.display = 'block';
            timerDiv.style.display = 'inline-block';

            analysisStartTime = Date.now();
            timerSec.innerText = "0.0";

            // 타이머 시작 (100ms 단위)
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - analysisStartTime) / 1000;
                timerSec.innerText = elapsed.toFixed(1);
            }, 100);

            const steps = [
                { id: 'step-1', delay: 0 },
                { id: 'step-2', delay: 600 },
                { id: 'step-3', delay: 1200 }
            ];

            steps.forEach((step, index) => {
                setTimeout(() => {
                    const el = document.getElementById(step.id);
                    if (el) {
                        el.classList.add('active');
                        el.querySelector('i').className = 'fas fa-circle-notch fa-spin';

                        if (index > 0) {
                            const prevEl = document.getElementById(steps[index - 1].id);
                            prevEl.classList.remove('active');
                            prevEl.querySelector('i').className = 'fas fa-check';
                        }
                    }
                }, step.delay);
            });

            // API 호출을 애니메이션과 동시에 즉시 시작 (병렬 처리)
            fetchAiAnalysis(ticker);
        }

        async function fetchAiAnalysis(ticker) {
            try {
                const response = await fetch(`/api/ai-analysis?ticker=${ticker}`);
                const data = await response.json();

                // 서버 응답이 오면 타이머 중지
                clearInterval(timerInterval);

                const durations = data.durations;
                const now = new Date();
                const timeStr = now.toLocaleTimeString('ko-KR', { hour12: false });

                // 각 단계 완료 및 시간 표시
                const stepConfigs = [
                    { id: 'step-1', duration: durations.yfinance },
                    { id: 'step-2', duration: durations.pattern },
                    { id: 'step-3', duration: durations.gemini }
                ];

                stepConfigs.forEach(config => {
                    const el = document.getElementById(config.id);
                    if (el) {
                        el.classList.remove('active');
                        el.querySelector('i').className = 'fas fa-check';
                        const timeSpan = el.querySelector('.step-time');
                        timeSpan.innerHTML = `<span style="color: #ff4b4b;">(${ (config.duration/1000).toFixed(2) }s)</span> [${timeStr}]`;
                        timeSpan.style.color = "#888";
                    }
                });

                // 사용자 체감을 위해 모든 작업이 완료되었음을 잠깐 노출 후 결과 전환
                setTimeout(() => {
                    document.getElementById('ai-status').style.display = 'none';
                    document.getElementById('ai-timer').style.display = 'none';

                    const reportContainer = document.getElementById('ai-report-container');
                    const scoreHeader = document.getElementById('ai-score-header');
                    const contentDiv = document.getElementById('ai-content');

                    scoreHeader.innerText = `AI 분석 신뢰도 점수: ${data.confidenceScore}점`;
                    contentDiv.innerHTML = marked.parse(data.report.trim());
                    latestReport = data.report; // 텔레그램 전송을 위해 저장
                    reportContainer.style.display = 'block';

                    // 차트에 패턴 및 타점 표시
                    updateChartWithAiData(data);
                }, 500);

            } catch (error) {
                clearInterval(timerInterval);
                console.error('AI 분석 실패:', error);
                alert('AI 분석 중 오류가 발생했습니다.');
                document.getElementById('ai-btn-container').style.display = 'block';
                document.getElementById('ai-status').style.display = 'none';
                document.getElementById('ai-timer').style.display = 'none';
            }
        }

        function updateChartWithAiData(aiData) {
            const updateLayout = { shapes: [...shapes] }; // 기존 spikes 유지
            const newTraces = [];

            // 1. 하모닉 패턴 (AB=CD) 선 그리기
            if (aiData.patternDetails && aiData.patternDetails.points) {
                const pts = aiData.patternDetails.points;
                const patternX = pts.map(p => priceTrace.x[p.index]);
                const patternY = pts.map(p => p.price);

                newTraces.push({
                    x: patternX, y: patternY,
                    mode: 'lines+markers',
                    name: aiData.pattern || 'Harmonic Pattern',
                    line: { color: 'yellow', width: 3, dash: 'dot' },
                    marker: { size: 8, color: 'yellow' }
                });
            }

            // 2. 매수/매도/손절 타점 (수평선)
            if (aiData.targets) {
                const t = aiData.targets;
                const xRange = [priceTrace.x[0], priceTrace.x[priceTrace.x.length - 1]];

                const colors = { buyZone: '#28a745', sellZone: '#ff4b4b', stopLoss: '#ffc107' };
                const labels = { buyZone: 'Buy Zone', sellZone: 'Sell Zone', stopLoss: 'Stop Loss' };
                const symbol = /*[[${currencySymbol}]]*/ '$';

                Object.keys(t).forEach(key => {
                    updateLayout.shapes.push({
                        type: 'line',
                        xref: 'x', yref: 'y',
                        x0: xRange[0], x1: xRange[1],
                        y0: t[key], y1: t[key],
                        line: { color: colors[key], width: 2, dash: 'dash' }
                    });

                    // 라벨용 텍스트 추가 (어노테이션)
                    if (!updateLayout.annotations) updateLayout.annotations = [];
                    updateLayout.annotations.push({
                        x: xRange[1], y: t[key],
                        xref: 'x', yref: 'y',
                        text: labels[key] + ' (' + symbol + formatNumber(t[key], symbol === '₩' ? 0 : 2) + ')',
                        showarrow: false,
                        xanchor: 'right', yanchor: 'bottom',
                        font: { color: colors[key], size: 12 }
                    });
                });
            }

            Plotly.addTraces('chart', newTraces);
            Plotly.relayout('chart', updateLayout);
        }

        async function sendAiReport() {
            const btn = document.getElementById('btn-send-telegram');
            const originalContent = btn.innerHTML;

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 전송 중...';

                const response = await fetch('/api/send-telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ticker: currentTicker,
                        report: latestReport
                    })
                });

                const result = await response.json();
                if (result.success) {
                    btn.style.background = '#28a745';
                    btn.innerHTML = '<i class="fas fa-check"></i> 전송 완료!';
                    setTimeout(() => {
                        btn.style.background = '#0088cc';
                        btn.innerHTML = originalContent;
                        btn.disabled = false;
                    }, 3000);
                } else {
                    throw new Error('전송 실패');
                }
            } catch (error) {
                console.error('텔레그램 전송 에러:', error);
                alert('텔레그램 전송에 실패했습니다.');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }
    </script>
